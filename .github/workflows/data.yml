name: Data tools
on:
  pull_request:
    paths: ["src/marine_ssl/**", "tests/**", "configs/**", "pyproject.toml", ".github/workflows/data.yml"]
  push:
    branches: [main]
    paths: ["src/marine_ssl/**", "tests/**", "configs/**", "pyproject.toml", ".github/workflows/data.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -c "import pathlib, yaml; [yaml.safe_load(p.read_text()) for p in pathlib.Path('configs').glob('*.yaml')]"
