[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rare-event-ssl-data"
version = "0.1.0"
description = "Quota-based marine acoustic data acquisition and source-level split checks"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32,<3",
  "PyYAML>=6,<7",
  "soundfile>=0.12,<1",
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
