[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rare-event-ssl-data"
version = "0.1.0"
description = "Quota-based marine acoustic data acquisition and source-level split checks"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32,<3",
  "PyYAML>=6,<7",
  "soundfile>=0.12,<1",
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
]

[project.optional-dependencies]
evaluation = [
  "scikit-learn==1.5.1",
  "joblib>=1.4,<2",
]
experiments = [
  "torch==2.2.2",
  "torchaudio==2.2.2",
  "transformers==4.44.0",
  "scikit-learn==1.5.1",
  "numpy==1.26.4",
  "joblib>=1.4,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
